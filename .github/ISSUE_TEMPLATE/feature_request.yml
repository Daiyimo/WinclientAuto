name: Feature Request
description: 建议新功能或改进
title: "[Feature]: "
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请清晰描述你的想法，方便我们评估。

  - type: dropdown
    id: category
    attributes:
      label: 类别
      description: 这是什么类型的功能？
      options:
        - 新应用适配
        - 框架核心改进
        - CLI 命令增强
        - 测试 / 报告
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能解决什么问题？
      placeholder: 我在使用 ... 时遇到 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你希望看到的解决方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他解决方案？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他上下文、截图或参考资料。
