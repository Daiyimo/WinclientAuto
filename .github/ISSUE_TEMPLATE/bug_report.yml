name: Bug Report
description: 报告 winclient-auto 的 bug
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 bug！请填写以下信息帮助我们复现和修复问题。

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      description: 哪个部分出了问题？
      options:
        - CLI (wca 命令)
        - Core (ElectronApp / NativeApp / BrowserApp)
        - Utils (process / cdp / csv_loader)
        - pytest plugin (fixtures)
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      description: 你使用的版本或 commit hash。
      placeholder: "e.g., v0.1.0 或 commit abc1234"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: "e.g., 3.10.12"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "e.g., Windows 11 Pro 22631"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供清晰的步骤来复现 bug。
      placeholder: |
        1. 安装：`pip install -e ".[dev]"`
        2. 运行：`wca app launch --exe ...`
        3. 执行：`wca dom click --sel ...`
        4. 出现错误...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？包含错误信息或 traceback。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Traceback
      description: 贴上相关输出，会自动格式化为代码块。
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他上下文、截图等有助于理解问题的信息。
